[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chamber_obb"
version = "0.1.0"
description = "Library core for bioprocess chamber/channel OBB detection (preprocess -> infer -> postprocess)."
requires-python = ">=3.12"
dependencies = [
    # torch nicht festlegen: Auf dem Cloud-Rechner gibt der NVIDIA-Container
    # die Version per PIP_CONSTRAINT fest vor (passend zu GPU und Treiber).
    "torch>=2.4",
    "ultralytics>=8.4.138,<9",
    "numpy>=1.26",
    "tifffile>=2023.1.1",
    # headless: dasselbe cv2 wie bei acia und im Container, ohne GUI-Abhaengigkeiten
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",  # data.yaml der Trainingslaeufe (train()); kommt auch ueber ultralytics
]

# acia is only needed by chamber_obb.dashboard (AD-2) -- never a hard
# dependency of the core detection path (`import chamber_obb` must succeed
# without it). `nd2` for real .nd2 acquisitions, `widget` for
# anywidget/SequenceDashboard.
[project.optional-dependencies]
dashboard = ["acia[nd2,widget]==0.4.0"]

[tool.setuptools]
packages = ["chamber_obb"]

# Flat layout: this pyproject.toml lives one level inside the package dir it
# describes (matches the architecture spine's Structural Seed), so the
# package's own root ("." from here) is what setuptools installs as "chamber_obb".
[tool.setuptools.package-dir]
chamber_obb = "."
